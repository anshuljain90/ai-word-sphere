<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Ecosystem Word Sphere</title>

  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #111827 0%, #020617 100%);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      color: white;
    }

    #tag-cloud {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .sphere {
      position: relative;
      width: 700px;
      height: 700px;
      transform-style: preserve-3d;
      animation: rotateSphere 25s linear infinite;
    }

    .tag {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      text-shadow:
        0 0 8px rgba(56,189,248,0.8),
        0 0 16px rgba(56,189,248,0.6);
      transition: all 0.3s ease;
      white-space: nowrap;
      cursor: pointer;
    }

    .tag:hover {
      color: #ffffff;
      transform: scale(1.4) !important;
      text-shadow:
        0 0 12px #fff,
        0 0 22px #38bdf8,
        0 0 40px #38bdf8;
    }

    @keyframes rotateSphere {
      from {
        transform: rotateY(0deg) rotateX(0deg);
      }
      to {
        transform: rotateY(360deg) rotateX(360deg);
      }
    }

    .title {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
      letter-spacing: 2px;
      z-index: 10;
    }

    .subtitle {
      position: absolute;
      top: 75px;
      width: 100%;
      text-align: center;
      font-size: 16px;
      color: #94a3b8;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="title">AI Ecosystem Sphere</div>
  <div class="subtitle">
    Generative AI • AI Agents • LLM Stack • Developer AI Tools
  </div>

  <div id="tag-cloud">
    <div class="sphere" id="sphere"></div>
  </div>

  <script>
    const words = [
      "ChatGPT",
      "Claude",
      "Gemini",
      "Copilot",
      "Cursor",
      "GitHub Copilot",
      "OpenAI",
      "LangChain",
      "CrewAI",
      "AutoGen",
      "MCP",
      "AI Agents",
      "Agentic AI",
      "LLM",
      "Generative AI",
      "RAG",
      "Prompt Engineering",
      "Embeddings",
      "Vector Database",
      "Hugging Face",
      "Llama",
      "Mistral",
      "DeepSeek",
      "TensorFlow",
      "PyTorch",
      "AWS",
      "Azure",
      "Google Cloud",
      "Python",
      "Jupyter",
      "VS Code",
      "Codeium",
      "Tabnine",
      "Perplexity",
      "Midjourney",
      "Runway",
      "Sora",
      "LangGraph",
      "Semantic Kernel",
      "Pinecone",
      "FAISS",
      "Ollama",
      "LM Studio",
      "AnythingLLM",
      "Groq",
      "Together AI",
      "Replicate",
      "Vercel",
      "Replit",
      "Devin",
      "Amazon Q",
      "NotebookLM",
      "Inference",
      "Fine-Tuning",
      "AI Automation",
      "Reasoning Models",
      "Semantic Search",
      "Vector Search",
      "Transformer",
      "Neural Networks",
      "Multimodal AI"
    ];

    const sphere = document.getElementById("sphere");

    const radius = 280;

    words.forEach((word, i) => {
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.innerText = word;

      const phi = Math.acos(-1 + (2 * i) / words.length);
      const theta = Math.sqrt(words.length * Math.PI) * phi;

      const x = radius * Math.cos(theta) * Math.sin(phi);
      const y = radius * Math.sin(theta) * Math.sin(phi);
      const z = radius * Math.cos(phi);

      tag.style.transform =
        `translate3d(${x}px, ${y}px, ${z}px)`;

      sphere.appendChild(tag);
    });

    // Mouse interaction
    document.addEventListener("mousemove", (e) => {
      const x = (window.innerWidth / 2 - e.clientX) / 50;
      const y = (window.innerHeight / 2 - e.clientY) / 50;

      sphere.style.transform =
        `rotateY(${x}deg) rotateX(${y}deg)`;
    });
  </script>

</body>
</html>
