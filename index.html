<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Ecosystem Word Sphere</title>

  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #111827 0%, #020617 100%);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      color: white;
    }

    #tag-cloud {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .sphere {
      position: relative;
      width: 700px;
      height: 700px;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .tag {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
      font-weight: bold;
      color: #38bdf8;
      text-shadow:
        0 0 8px rgba(56,189,248,0.8),
        0 0 16px rgba(56,189,248,0.6);
      transition: color 0.3s ease, text-shadow 0.3s ease;
      white-space: nowrap;
      cursor: pointer;
    }

    .tag:hover {
      color: #ffffff;
      text-shadow:
        0 0 12px #fff,
        0 0 22px #38bdf8,
        0 0 40px #38bdf8;
    }
  </style>
</head>
<body>

  <div id="tag-cloud">
    <div class="sphere" id="sphere"></div>
  </div>

  <script>
    // [word, weight] — higher weight = bigger and more prominent
    const words = [
      ["ChatGPT", 10],
      ["Claude", 10],
      ["OpenAI", 10],
      ["LLM", 10],
      ["Generative AI", 10],
      ["Gemini", 9],
      ["GitHub Copilot", 9],
      ["AI Agents", 9],
      ["Python", 9],
      ["RAG", 8],
      ["Cursor", 8],
      ["LangChain", 8],
      ["Copilot", 8],
      ["Agentic AI", 8],
      ["Prompt Engineering", 7],
      ["Hugging Face", 7],
      ["Llama", 7],
      ["Multimodal AI", 7],
      ["Fine-Tuning", 7],
      ["Embeddings", 6],
      ["Vector Database", 6],
      ["Mistral", 6],
      ["PyTorch", 6],
      ["TensorFlow", 6],
      ["AWS", 6],
      ["Azure", 6],
      ["Google Cloud", 6],
      ["Perplexity", 6],
      ["Midjourney", 6],
      ["Transformer", 6],
      ["Neural Networks", 6],
      ["MCP", 5],
      ["CrewAI", 5],
      ["AutoGen", 5],
      ["LangGraph", 5],
      ["DeepSeek", 5],
      ["Ollama", 5],
      ["Groq", 5],
      ["Devin", 5],
      ["Sora", 5],
      ["Inference", 5],
      ["Reasoning Models", 5],
      ["VS Code", 5],
      ["Semantic Kernel", 4],
      ["Pinecone", 4],
      ["FAISS", 4],
      ["LM Studio", 4],
      ["AnythingLLM", 4],
      ["Together AI", 4],
      ["Replicate", 4],
      ["Vercel", 4],
      ["Replit", 4],
      ["Amazon Q", 4],
      ["NotebookLM", 4],
      ["AI Automation", 4],
      ["Semantic Search", 4],
      ["Vector Search", 4],
      ["Codeium", 4],
      ["Tabnine", 4],
      ["Runway", 4],
      ["Jupyter", 4]
    ];

    const sphere = document.getElementById("sphere");
    const radius = 280;

    const minWeight = Math.min(...words.map(w => w[1]));
    const maxWeight = Math.max(...words.map(w => w[1]));
    const minFont = 12;
    const maxFont = 30;

    words.forEach(([word, weight], i) => {
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.innerText = word;

      const t = (weight - minWeight) / (maxWeight - minWeight);
      const fontSize = minFont + t * (maxFont - minFont);
      tag.style.fontSize = fontSize + "px";
      tag.style.opacity = (0.55 + 0.45 * t).toFixed(2);

      const phi = Math.acos(-1 + (2 * i) / words.length);
      const theta = Math.sqrt(words.length * Math.PI) * phi;

      const x = radius * Math.cos(theta) * Math.sin(phi);
      const y = radius * Math.sin(theta) * Math.sin(phi);
      const z = radius * Math.cos(phi);

      tag.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;

      sphere.appendChild(tag);
    });

    // Mouse-driven rotation: cursor position relative to screen center
    // controls spin direction & speed. Cursor at center = sphere stops.
    let rotX = -20;
    let rotY = 0;
    let velX = 0.15;
    let velY = 0.25;

    document.addEventListener("mousemove", (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;
      velY = dx * 1.5;
      velX = -dy * 1.5;
    });

    function animate() {
      rotX += velX;
      rotY += velY;
      sphere.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      requestAnimationFrame(animate);
    }
    animate();
  </script>

</body>
</html>
